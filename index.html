<html>
<head>
    <style>
        #container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
        }

        #inspector {
            width: 300px;
            height: 500px;
            border: 1px solid black;
            border-radius: 5px;
        }
    </style>
    <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous">
    </script>
    <script src="utils/uid.js"></script>
    <script src="BestAppsComponent.js"></script>
    <script src="custom/AppYearMonthComponent.js"></script>
    <script src="custom/ObjectInspector/BestAppsObjectInspectorComponent.js"></script>
    <script src="custom/ObjectInspector/BestAppsObjectInspectorObjectsComponent.js"></script>
    <script src="custom/ObjectInspector/tab/BestAppsObjectInspectorTabsComponent.js"></script>
    <script src="custom/ObjectInspector/tab/BestAppsObjectInspectorTabComponent.js"></script>
    <script src="custom/ObjectInspector/tab/Property/BestAppsObjectInspectorPropertiesTabComponent.js"></script>
    <script src="custom/ObjectInspector/tab/Event/BestAppsObjectInspectorEventsTabComponent.js"></script>
    <script src="custom/ObjectInspector/tab/Property/BestAppsObjectInspectorPropertyComponent.js"></script>
    <script src="custom/ObjectInspector/tab/Property/BestAppsObjectInspectorPropertyInputComponent.js"></script>
    <script src="custom/ObjectInspector/tab/Property/BestAppsObjectInspectorPropertyListComponent.js"></script>
    <script src="custom/ObjectInspector/tab/Property/BestAppsObjectInspectorPropertyArrayComponent.js"></script>
    <script src="custom/ObjectInspector/BestAppsPropertyAdaptor.js"></script>
    <script src="custom/ObjectPalette/BestAppsObjectPaletteComponent.js"></script>
</head>
<body>
<div id="container">
    <div id="inspector"></div>
    <div>
        <div id="year-month-demo"></div>
    </div>
</div>
<script>

    window.addEventListener('load', function () {
        let from = document.createElement(AppYearMonthComponent.tag);
        from.subscribe(BestAppsComponent.EVENT_CHANGED, (data) => {
            console.log('CHANGED FROM', data);
        });
        from.setAttribute('id', `from`);
        from.setAttribute('year', `2024`);
        from.setAttribute('month', `May`);
        from.setAttribute('name', `From1`);
        from.setAttribute('type', `Calendar`);

        document.getElementById('container').appendChild(from);
        let to = document.createElement(AppYearMonthComponent.tag);
        to.subscribe(BestAppsComponent.EVENT_CHANGED, (data) => {
            console.log('CHANGED TO', data);
        });
        to.setAttribute('year', `2023`);
        to.setAttribute('month', `Jan`);
        to.setAttribute('name', `To1`);
        to.setAttribute('type', `Calendar`);
        document.getElementById('container').appendChild(to);

        setTimeout(() => {
            let el = document.getElementById('from').cloneNode(true);
            el.setAttribute('id', `from2`);
            document.getElementById('container').appendChild(el);
            let el2 = $('#from').clone(true, true);
            $('#container').append(el2);
            el2.attr('debug', 'debug');
        }, 1);
    });

</script>
</body>
</html>
